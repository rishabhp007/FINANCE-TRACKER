{% extends "layout.html" %}

{% block main %}

<h2>Transaction History</h2>

<table>

    <thead>
        <tr>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>

    {% for t in transactions %}
        <tr>
            <td>{{ t.type }}</td>
            <td>{{ t.category }}</td>
            <td>{{ t.amount | inr }}</td>
            <td>{{ t.description }}</td>
            <td>{{ t.date }}</td>
        </tr>
    {% endfor %}

    </tbody>

</table>

{% endblock %}
