{% extends "layout.html" %}

{% block main %}

<h2>Login</h2>

<form action="/login" method="post" class="form-box">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p>
Don't have an account?
<a href="/register">Register</a>
</p>

{% endblock %}
